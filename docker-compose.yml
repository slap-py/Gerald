services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: gerald
      POSTGRES_PASSWORD: gerald
      POSTGRES_DB: gerald
    ports: ['5432:5432']
    volumes: ['gerald_pgdata:/var/lib/postgresql/data']
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
volumes:
  gerald_pgdata:
